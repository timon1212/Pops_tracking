<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sucker Vending Manager</title>
<style>
body{font-family:system-ui;margin:0;background:#f4f6f8;}
header{background:#ff4da6;color:white;padding:16px;text-align:center;font-size:22px;font-weight:bold;}
.tabs{display:flex;background:#fff;}
.tabs button{flex:1;padding:14px;border:none;background:#eee;font-weight:bold;}
.tabs button.active{background:#ff4da6;color:white;}
.container{padding:14px;}
.card{background:white;padding:14px;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.low{border-left:8px solid #dc3545;background:#fff3f3;}
.good{border-left:8px solid #28a745;}
input,select{width:100%;padding:12px;margin-top:6px;margin-bottom:10px;border-radius:10px;border:1px solid #ccc;}
button.action{width:100%;padding:14px;border:none;border-radius:12px;background:#28a745;color:white;font-size:16px;font-weight:bold;margin-top:6px;}
.summary{background:white;padding:12px;margin-bottom:12px;border-radius:12px;}
.log{font-size:14px;border-top:1px solid #ddd;margin-top:6px;padding-top:6px;}
</style>
</head>
<body>
<header>🍭 Vending Manager</header>
<div class="tabs">
<button class="active" onclick="showTab('inventory', this)">Inventory</button>
<button onclick="showTab('route', this)">Route Refill</button>
<button onclick="showTab('history', this)">History</button>
</div>
<div class="container">
<div id="inventoryTab"></div>
<div id="routeTab" style="display:none"></div>
<div id="historyTab" style="display:none"></div>
</div>
<script>
var COST = 0.04;
var PRICE = 1/3;

var db = JSON.parse(localStorage.getItem("inv")||"[]");
var machines = JSON.parse(localStorage.getItem("machines")||"[]");
var logs = JSON.parse(localStorage.getItem("logs")||"[]");

function saveAll() {
    localStorage.setItem("inv", JSON.stringify(db));
    localStorage.setItem("machines", JSON.stringify(machines));
    localStorage.setItem("logs", JSON.stringify(logs));
    renderAll();
}

function money(n){ return "$" + n.toFixed(2); }

function showTab(tab, btn){
    document.getElementById("inventoryTab").style.display = (tab=="inventory")?"block":"none";
    document.getElementById("routeTab").style.display = (tab=="route")?"block":"none";
    document.getElementById("historyTab").style.display = (tab=="history")?"block":"none";
    var tabs = document.querySelectorAll(".tabs button");
    for(var i=0;i<tabs.length;i++){ tabs[i].className = ""; }
    btn.className = "active";
}

function renderInventory() {
    var total = 0;
    for(var i=0;i<db.length;i++){ total += db[i].stock; }
    var invested = total * COST;
    var profit = total * PRICE - invested;

    var html = '<div class="summary">' +
               '<b>Total Pieces:</b> '+total+'<br>' +
               '<b>Inventory Cost:</b> '+money(invested)+'<br>' +
               '<b>Expected Profit:</b> <span style="color:green">'+money(profit)+'</span>' +
               '</div>' +
               '<h3>Add Flavor</h3>' +
               '<input id="fname" placeholder="Flavor">' +
               '<input id="fstock" type="number" placeholder="Starting stock">' +
               '<input id="fmin" type="number" placeholder="Restock at">' +
               '<button class="action" onclick="addFlavor()">Add Flavor</button><hr>';

    for(var i=0;i<db.length;i++){
        var low = db[i].stock <= db[i].min;
        html += '<div class="card '+(low?'low':'good')+'">' +
                '<b>'+db[i].name+'</b> — '+db[i].stock+'<br>' +
                'Min: '+db[i].min+'<br>' +
                '<input id="adj'+i+'" type="number" placeholder="Amount">' +
                '<button class="action" onclick="adjust('+i+',1)">Add</button>' +
                '<button class="action" style="background:#dc3545" onclick="adjust('+i+',-1)">Remove</button>';
        if(low){ html += '<div style="color:red;font-weight:bold">RESTOCK NEEDED</div>'; }
        html += '</div>';
    }
    document.getElementById("inventoryTab").innerHTML = html;
}

function addFlavor(){
    var fname = document.getElementById("fname").value;
    var fstock = parseInt(document.getElementById("fstock").value,10)||0;
    var fmin = parseInt(document.getElementById("fmin").value,10)||0;
    if(!fname) return;
    db.push({name: fname, stock: fstock, min: fmin});
    document.getElementById("fname").value="";
    document.getElementById("fstock").value="";
    document.getElementById("fmin").value="";
    saveAll();
}

function adjust(i, dir){
    var amt = parseInt(document.getElementById("adj"+i).value,10)||0;
    db[i].stock += amt*dir;
    if(db[i].stock<0) db[i].stock = 0;
    saveAll();
}

function renderRoute(){
    var html = '<h3>Add Machine</h3>' +
               '<input id="mname" placeholder="Location name">' +
               '<button class="action" onclick="addMachine()">Add Machine</button><hr>';
    for(var i=0;i<machines.length;i++){
        html += '<div class="card"><b>'+machines[i]+'</b>' +
                '<select id="flavor'+i+'">';
        for(var j=0;j<db.length;j++){
            html += '<option value="'+j+'">'+db[j].name+'</option>';
        }
        html += '</select>' +
                '<input id="qty'+i+'" type="number" placeholder="Loaded amount">' +
                '<button class="action" onclick="loadMachine('+i+')">Record Fill</button>' +
                '</div>';
    }
    document.getElementById("routeTab").innerHTML = html;
}

function addMachine(){
    var mname = document.getElementById("mname").value;
    if(!mname) return;
    machines.push(mname);
    document.getElementById("mname").value="";
    saveAll();
}

function loadMachine(i){
    var flavorIndex = parseInt(document.getElementById("flavor"+i).value,10);
    var qty = parseInt(document.getElementById("qty"+i).value,10);
    if(!qty) return;
    db[flavorIndex].stock -= qty;
    if(db[flavorIndex].stock<0) db[flavorIndex].stock=0;
    var revenue = qty*PRICE;
    var profit = revenue - (qty*COST);
    logs.unshift({date:new Date().toLocaleString(), machine: machines[i], flavor: db[flavorIndex].name, qty: qty, revenue: revenue, profit: profit});
    saveAll();
}

function renderHistory(){
    var html = '';
    for(var i=0;i<logs.length;i++){
        html += '<div class="card"><b>'+logs[i].machine+'</b><br>'+
                logs[i].flavor+' — '+logs[i].qty+'<br>'+
                'Revenue: '+money(logs[i].revenue)+'<br>'+
                'Profit: <span style="color:green">'+money(logs[i].profit)+'</span>'+
                '<div class="log">'+logs[i].date+'</div></div>';
    }
    document.getElementById("historyTab").innerHTML = html;
}

function renderAll(){
    renderInventory();
    renderRoute();
    renderHistory();
}

renderAll();
</script>
</body>
</html>
