<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sucker Vending Manager</title>
<style>
body{font-family:system-ui;margin:0;background:#f4f6f8;}
header{background:#ff4da6;color:white;padding:16px;text-align:center;font-size:22px;font-weight:bold;}
.tabs{display:flex;background:#fff;}
.tabs button{flex:1;padding:14px;border:none;background:#eee;font-weight:bold;}
.tabs button.active{background:#ff4da6;color:white;}
.container{padding:14px;}
.card{background:white;padding:14px;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.low{border-left:8px solid #dc3545;background:#fff3f3;}
.good{border-left:8px solid #28a745;}
input,select{width:100%;padding:12px;margin-top:6px;margin-bottom:10px;border-radius:10px;border:1px solid #ccc;}
button.action{width:100%;padding:14px;border:none;border-radius:12px;background:#28a745;color:white;font-size:16px;font-weight:bold;}
.summary{background:white;padding:12px;margin-bottom:12px;border-radius:12px;}
.log{font-size:14px;border-top:1px solid #ddd;margin-top:6px;padding-top:6px;}
</style>
</head>
<body>
<header>🍭 Vending Manager</header>
<div class="tabs">
<button class="active" onclick="showTab('inventory',event)">Inventory</button>
<button onclick="showTab('route',event)">Route Refill</button>
<button onclick="showTab('history',event)">History</button>
</div>
<div class="container">
<div id="inventoryTab"></div>
<div id="routeTab" style="display:none"></div>
<div id="historyTab" style="display:none"></div>
</div>
<script>
const COST=0.04;
const PRICE=1/3;
let db=JSON.parse(localStorage.getItem("inv")||"[]");
let machines=JSON.parse(localStorage.getItem("machines")||"[]");
let logs=JSON.parse(localStorage.getItem("logs")||"[]");
function saveAll(){
localStorage.setItem("inv",JSON.stringify(db));
localStorage.setItem("machines",JSON.stringify(machines));
localStorage.setItem("logs",JSON.stringify(logs));
renderAll();
}
function money(n){return "$"+n.toFixed(2)}
function showTab(tab,e){
inventoryTab.style.display=tab=="inventory"?"block":"none";
routeTab.style.display=tab=="route"?"block":"none";
historyTab.style.display=tab=="history"?"block":"none";
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
e.target.classList.add("active");
}
function renderInventory(){
let total=0;
db.forEach(i=>total+=i.stock);
let invested=total*COST;
let profit=(total*PRICE)-invested;
inventoryTab.innerHTML=`<div class="summary">
<b>Total Pieces:</b> ${total}<br>
<b>Inventory Cost:</b> ${money(invested)}<br>
<b>Expected Profit:</b> <span style="color:green">${money(profit)}</span>
</div>
<h3>Add Flavor</h3>
<input id="fname" placeholder="Flavor">
<input id="fstock" type="number" placeholder="Starting stock">
<input id="fmin" type="number" placeholder="Restock at">
<button class="action" onclick="addFlavor()">Add Flavor</button>
<hr>`;
db.forEach((f,i)=>{
const low=f.stock<=f.min;
inventoryTab.innerHTML+=`<div class="card ${low?'low':'good'}">
<b>${f.name}</b> — ${f.stock}<br>
Min: ${f.min}<br>
<input id="adj${i}" type="number" placeholder="Amount">
<button class="action" onclick="adjust(${i},1)">Add</button>
<button class="action" style="background:#dc3545" onclick="adjust(${i},-1)">Remove</button>
${low?'<div style="color:red;font-weight:bold">RESTOCK NEEDED</div>':''}
</div>`;
});
}
function addFlavor(){
if(!fname.value)return;
db.push({name:fname.value,stock:+fstock.value||0,min:+fmin.value||0});
fname.value="";fstock.value="";fmin.value="";
saveAll();
}
function adjust(i,dir){
let amt=+document.getElementById("adj"+i).value||0;
db[i].stock+=amt*dir;
if(db[i].stock<0)db[i].stock=0;
saveAll();
}
function renderRoute(){
routeTab.innerHTML=`<h3>Add Machine</h3>
<input id="mname" placeholder="Location name">
<button class="action" onclick="addMachine()">Add Machine</button><hr>`;
machines.forEach((m,i)=>{
routeTab.innerHTML+=`<div class="card">
<b>${m}</b>
<select id="flavor${i}">
${db.map((f,j)=>`<option value="${j}">${f.name}</option>`).join("")}
</select>
<input id="qty${i}" type="number" placeholder="Loaded amount">
<button class="action" onclick="loadMachine(${i})">Record Fill</button>
</div>`;
});
}
function addMachine(){
if(!mname.value)return;
machines.push(mname.value);
mname.value="";
saveAll();
}
function loadMachine(i){
let flavorIndex=+document.getElementById("flavor"+i).value;
let qty=+document.getElementById("qty"+i).value;
if(!qty)return;
db[flavorIndex].stock-=qty;
if(db[flavorIndex].stock<0)db[flavorIndex].stock=0;
let revenue=qty*PRICE;
let profit=revenue-(qty*COST);
logs.unshift({
date:new Date().toLocaleString(),
machine:machines[i],
flavor:db[flavorIndex].name,
qty,revenue,profit
});
saveAll();
}
function renderHistory(){
historyTab.innerHTML="";
logs.forEach(l=>{
historyTab.innerHTML+=`<div class="card">
<b>${l.machine}</b><br>
${l.flavor} — ${l.qty}<br>
Revenue: ${money(l.revenue)}<br>
Profit: <span style="color:green">${money(l.profit)}</span>
<div class="log">${l.date}</div>
</div>`;
});
}
function renderAll(){
renderInventory();
renderRoute();
renderHistory();
}
renderAll();
</script>
</body>
</html>
